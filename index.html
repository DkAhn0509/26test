<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>탐사대 작전 본부 · 빛 / 별과 우주 수준별 퀘스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#1a73e8;--red:#d93025;--yellow:#f9ab00;--green:#1e8e3e;--ink:#202124;--dim:#5f6368;--line:#dadce0;--bg:#f8f9fa;--card:#fff;--tc:#1a73e8;--tcbg:#e8f0fe}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;word-break:keep-all}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;background:none;border:0;padding:0}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--blue)}.dots i:nth-child(2){background:var(--red)}.dots i:nth-child(3){background:var(--yellow)}.dots i:nth-child(4){background:var(--green)}
.sp{flex:1}
.switch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px 6px 8px;font-size:14px;font-weight:500}
.switch b{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:.2s}
.switch b::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
body.teacher .switch{border-color:var(--blue);color:var(--blue)}
body.teacher .switch b{background:var(--blue)}body.teacher .switch b::after{left:16px}
main{max-width:980px;margin:0 auto;padding:24px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:16px}
h1{font-size:30px;line-height:1.25;margin:0 0 6px;font-weight:900}
h2{font-size:20px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}
p{margin:0 0 10px}
.eyebrow{font-size:13px;font-weight:700;color:var(--tc);letter-spacing:.04em;margin-bottom:4px}
.dim{color:var(--dim);font-size:14px}
.btn{border:0;background:var(--blue);color:#fff;border-radius:999px;padding:11px 24px;font-weight:700;font-size:15px;min-height:44px}
.btn:disabled{background:var(--line);color:#9aa0a6;cursor:default}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
.btn.small{padding:6px 14px;font-size:13px;min-height:34px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.codebox{background:var(--tcbg);border-radius:20px;padding:20px;text-align:center}
.codebox input{width:100%;max-width:260px;text-align:center;font-size:34px;font-weight:900;letter-spacing:.35em;padding:10px 0 10px .35em;border:2px solid var(--line);border-radius:14px;background:#fff;text-transform:uppercase}
.codebox input:focus{outline:0;border-color:var(--blue)}
.err{color:var(--red);font-size:14px;font-weight:500;min-height:22px;margin-top:6px}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.dex div{border:1px dashed var(--line);border-radius:14px;padding:12px 10px;text-align:center;font-size:13px;color:#9aa0a6;min-height:84px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.dex div.on{border:1px solid var(--c);background:#fff;color:var(--ink)}
.dex div b{font-size:14px}.dex div.on i{font-style:normal;color:var(--c);font-weight:700;font-size:12px}
.decode{font-size:34px;font-weight:900;letter-spacing:.06em;text-align:center;padding:40px 10px;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:6px;margin:14px 0 18px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps span.on{background:var(--tc)}
.core{border-left:6px solid var(--tc);background:var(--tcbg);border-radius:14px;padding:14px 18px;font-weight:700;font-size:17px;margin-bottom:16px}
.core small{display:block;font-size:12px;color:var(--tc);letter-spacing:.05em;margin-bottom:2px}
.deck{border:2px solid var(--tc);border-radius:20px;padding:26px 22px;min-height:150px;display:flex;flex-direction:column;justify-content:center;font-size:20px;font-weight:700;text-align:center;background:#fff;animation:pop .25s}
.deck small{font-size:12px;color:var(--tc);letter-spacing:.08em;margin-bottom:8px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.pips{display:flex;gap:6px;justify-content:center;margin:12px 0}.pips i{width:8px;height:8px;border-radius:50%;background:var(--line)}.pips i.on{background:var(--tc)}
.passage li{margin-bottom:6px}.passage{padding-left:20px;margin:0 0 6px}
.term{color:var(--tc)}.gloss{color:var(--dim);font-size:.92em}
.report{font-size:16px;line-height:1.85;border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff}
.report::before{content:"탐사 보고서 원문";display:block;font-size:12px;font-weight:700;color:var(--tc);letter-spacing:.08em;margin-bottom:6px}
.mlist{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.mlist li{border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:15px;color:#9aa0a6;background:#fff}
.mlist li.cur{border-color:var(--tc);color:var(--ink);font-weight:700;background:var(--tcbg)}
.mlist li.ok{color:var(--green);border-color:#ceead6;background:#e6f4ea}
.mlist li.ok::before{content:"완료 · ";font-weight:700}
.simview{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.simview svg{display:block;width:100%;height:auto;touch-action:manipulation}
.simview .pad{padding:12px 14px}
.ctrl{display:grid;gap:10px;margin:12px 0}
.ctrl label{display:grid;gap:2px;font-size:14px;font-weight:500}
input[type=range]{width:100%;height:32px;accent-color:var(--tc)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.tg{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500;min-height:40px}
.seg button.on,.tg.on{background:var(--tc);border-color:var(--tc);color:#fff}
.judge{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.jmsg{font-size:14px;font-weight:500}.jmsg.bad{color:var(--red)}.jmsg.good{color:var(--green)}
.read{font-weight:700;font-size:15px;padding:8px 14px;background:var(--bg);border-top:1px solid var(--line)}
.items{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;font-size:13px;color:var(--dim)}
.chip{border:1px solid var(--tc);color:var(--tc);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;animation:pop .3s}
.chip.empty{border-style:dashed;border-color:#9aa0a6;color:#80868b;font-weight:400;animation:none}
.pick{display:grid;gap:8px}
.pick .it{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:14px}
.pick .it.ok{border-color:#ceead6;background:#e6f4ea}
.pick .it .seg{margin-top:6px}
.qz{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;background:#fff}
.qz h3{font-size:17px}
.qz .opts{display:grid;gap:8px}
.qz .opts button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:15px;min-height:46px}
.qz .opts button.right{border-color:var(--green);background:#e6f4ea;font-weight:700}
.qz .opts button.wrong{border-color:var(--red);background:#fce8e6;color:var(--red)}
.qz .ex{margin-top:10px;font-size:14px;background:var(--bg);border-radius:10px;padding:10px 12px}
.guard{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--red);margin-bottom:10px}
.guard i{flex:1;height:10px;border-radius:5px;background:var(--red);transition:.4s}.guard i.off{background:var(--line)}
details.ext{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:#fff}
details.ext summary{font-weight:700;cursor:pointer}
details.ext p{margin:8px 0 0;font-size:14px;color:var(--dim)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;background:#fef7e0;color:#b06000;margin-left:6px;vertical-align:middle}
.badge{width:120px;height:120px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--blue) 0 25%,var(--red) 0 50%,var(--yellow) 0 75%,var(--green) 0);animation:pop .5s}
.badge span{width:98px;height:98px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;text-align:center;padding:6px}
/* teacher-only */
.tnote,.tonly{display:none}
body.teacher .tnote{display:block;border:1px dashed var(--blue);background:#e8f0fe;color:#174ea6;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
body.teacher .tnote b{font-weight:700}
body.teacher .tonly{display:block}
body.teacher .tag.tonly{display:inline-block}
body.teacher .sonly{display:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--dim)}
.tabs button.on{background:#e8f0fe;color:var(--blue)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--dim);font-weight:700}
.tw{overflow-x:auto}
.codebtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;text-align:left;width:100%}
.codebtn b{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--blue);letter-spacing:.08em}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cmp>div{border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;background:#fff}
.cmp h4{margin:10px 0 4px;font-size:12px;color:var(--dim)}.cmp ul,.cmp ol{margin:0;padding-left:18px}
.lv{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;color:#fff;background:var(--dim)}
pre.prompt{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font:13px/1.7 "Noto Sans KR",sans-serif;margin:0 0 10px}
dialog{border:0;border-radius:20px;padding:22px;max-width:520px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(32,33,36,.5)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (max-width:720px){.hero{grid-template-columns:1fr}.dex{grid-template-columns:repeat(3,1fr)}.cmp{grid-template-columns:1fr}h1{font-size:25px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="logo" id="goHome" type="button"><span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span>탐사대 작전 본부</button>
  <span class="sp"></span>
  <button class="switch" id="tSwitch" type="button" aria-pressed="false"><b></b>교사 해설</button>
</header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ===================== 유틸 ===================== */
const $=(q,el=document)=>el.querySelector(q), $$=(q,el=document)=>[...el.querySelectorAll(q)];
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));
const gloss=t=>t.replace(/\{([^|}]+)\|([^}]+)\}/g,'<b class="term">$1</b><span class="gloss">($2)</span>');
const plain=t=>t.replace(/\{([^|}]+)\|([^}]+)\}/g,'$1($2)');
const Q=(q,o,ex)=>({q,o,ex});            // 정답은 항상 o[0], 화면에서 섞는다
const COLORS=[['#1a73e8','#e8f0fe'],['#d93025','#fce8e6'],['#b06000','#fef7e0'],['#1e8e3e','#e6f4ea']];
const LV={L:{n:'하',who:'기초학력 지원·다문화 학생',rule:'한 문장에 한 개념 · 일상 예시 · 핵심 용어 3개 이내 · 확인 문제 2개'},
          M:{n:'중',who:'평균 수준 학생',rule:'문장을 짧게 나눔 · 핵심 용어에 괄호 풀이 · 예측 후 확인'},
          H:{n:'상',who:'심화 학습자',rule:'원문 유지 · 생각을 확장하는 질문 2개 · 탐구 주제 제안'}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
const tnote=t=>`<div class="tnote"><b>교사 해설</b> · ${t}</div>`;

/* ===================== 실험 장치 12종 ===================== */
const R=(k,label,min,max,step)=>({k,label,min,max,step});
const SVG=(inner,dark)=>`<svg viewBox="0 0 480 280" role="img" ${dark?'style="background:#202124"':'style="background:#f8f9fa"'}>${inner}</svg>`;
const TXT=(x,y,t,o,fill,halo)=>`<text x="${x}" y="${y}" ${/font-size=/.test(o)?'':'font-size="13"'} font-weight="700" ${/fill=/.test(o)?'':`fill="${fill}"`} ${halo?'stroke="#f8f9fa" stroke-width="4" stroke-linejoin="round" paint-order="stroke"':''} ${o}>${t}</text>`;
const TX=(x,y,t,o='')=>TXT(x,y,t,o,'#202124',1);
const TW=(x,y,t,o='')=>TXT(x,y,t,o,'#fff',0);
const LN=(x1,y1,x2,y2,c='#f9ab00',w=3,o='')=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${o}/>`;
const DASH='stroke-dasharray="5 5"';

const DEV={plane:'평면거울',cvxM:'볼록 거울',ccvM:'오목 거울',cvxL:'볼록 렌즈',ccvL:'오목 렌즈'};
const MIXN=['어두움','파란색','초록색','청록색','빨간색','자홍색','노란색','흰색'];
const STAR_M=[0,2,5], STAR_N=['가','나','다'], DOFF={1:-5,4:-2,10:0,25:2,100:5};
const TCLS=[[28000,'청색','#7fa8ff'],[10000,'청백색','#b9d0ff'],[7500,'백색','#ffffff'],[6000,'황백색','#fff3c4'],[5200,'황색','#ffe066'],[3500,'주황색','#ffa94d'],[0,'적색','#ff6b5b']];
const GALC={
 L:{cats:['성단','성운'],cards:[['별 수백 개가 무리 지어 모여 있다.','성단'],['가스와 티끌이 구름처럼 퍼져 있다.','성운'],['별 수십만 개가 공 모양으로 뭉쳐 있다.','성단'],['구름 같은 물질이 뒤쪽 별빛을 가려 검게 보인다.','성운']]},
 M:{cats:['산개 성단','구상 성단'],cards:[['별들이 엉성하게 흩어져 모여 있다.','산개 성단'],['별들이 공 모양으로 빽빽하게 모여 있다.','구상 성단'],['주로 파란색을 띠는 별들로 이루어져 있다.','산개 성단'],['주로 붉은색을 띠는 별들로 이루어져 있다.','구상 성단'],['주로 우리은하의 나선팔에 분포한다.','산개 성단']]},
 H:{cats:['방출 성운','반사 성운','암흑 성운'],cards:[['주변의 뜨거운 별에서 에너지를 받아 스스로 빛을 낸다.','방출 성운'],['주변의 별빛을 반사하여 밝게 보인다.','반사 성운'],['뒤쪽에서 오는 별빛을 가로막아 어둡게 보인다.','암흑 성운'],['오리온 대성운처럼 붉은빛으로 빛난다.','방출 성운']]}};
const GAL=[[-40,5],[-5,-30],[30,15],[55,-20],[-20,35]], GALN=['가','나','다','라','마'];
const EXPL={
 devs:['인공위성','우주 탐사선','우주 망원경','우주 정거장'],
 items:[['지구 주위를 돌며 날씨를 관측하고 통신을 연결한다.','인공위성'],['다른 행성까지 날아가 가까이에서 조사한다.','우주 탐사선'],['지구 대기 밖에서 먼 천체를 관측한다.','우주 망원경'],['우주인이 오래 머물며 실험한다.','우주 정거장']],
 evs:[['허블 우주 망원경 발사',1990],['스푸트니크 1호 발사',1957],['다누리 발사',2022],['아폴로 11호 달 착륙',1969]]};
const pickHTML=(cards,cats,done,pre)=>`<div class="pick">${cards.map((c,i)=>`<div class="it ${done[i]?'ok':''}">${c[0]}${done[i]?` <b>→ ${c[1]}</b>`:`<div class="seg">${cats.map((k,j)=>`<button type="button" data-act="${pre}:${i}:${j}">${k}</button>`).join('')}</div>`}</div>`).join('')}</div>`;

const SIMS={
/* ① 빛의 직진 */
shadow:{
 init:()=>({xo:260,xs:420,src:0}),
 ctrl:lv=>[R('xo','물체의 위치 (광원 쪽 ↔ 스크린 쪽)',130,340,5),...(lv!=='L'?[R('xs','스크린의 위치',360,440,5)]:[]),...(lv==='H'?[R('src','광원의 크기',0,24,2)]:[])],
 calc(s){const k=(s.xs-s.xo)/(s.xo-40);s.ratio=1+k;s.pen=16+(16+s.src)*k;s.umb=16+(16-s.src)*k},
 draw(s){const cy=140,h=16,u=Math.max(s.umb,0);let o='';
  o+=LN(40,cy-s.src,s.xs,cy-s.umb,'#f9ab00',2)+LN(40,cy+s.src,s.xs,cy+s.umb,'#f9ab00',2);
  if(s.src>0)o+=LN(40,cy+s.src,s.xs,cy-s.pen,'#f9ab00',1.5,DASH)+LN(40,cy-s.src,s.xs,cy+s.pen,'#f9ab00',1.5,DASH);
  o+=`<rect x="${s.xs}" y="20" width="8" height="240" fill="#dadce0"/>`;
  if(s.src>0)o+=`<rect x="${s.xs}" y="${cy-s.pen}" width="8" height="${2*s.pen}" fill="#9aa0a6"/>`;
  if(u>0)o+=`<rect x="${s.xs}" y="${cy-u}" width="8" height="${2*u}" fill="#202124"/>`;
  o+=`<rect x="${s.xo-4}" y="${cy-h}" width="8" height="${2*h}" rx="2" fill="#1a73e8"/>`;
  o+=s.src>0?`<rect x="34" y="${cy-s.src}" width="12" height="${2*s.src}" rx="5" fill="#f9ab00"/>`:`<circle cx="40" cy="${cy}" r="7" fill="#f9ab00"/>`;
  o+=TX(22,cy+ (s.src>0?s.src+20:26),'광원')+TX(s.xo-14,cy+h+18,'물체')+TX(s.xs-26,16,'스크린');

 H:{op:'귀환 신호',code:'M2VJ',
  text:'빛이 반사될 때 입사각과 반사각의 크기는 항상 같으며, 이를 반사 법칙이라고 한다. 표면이 매끄러우면 정반사가, 거칠면 난반사가 일어나지만 어느 경우에도 반사 법칙은 성립한다. 우리가 여러 방향에서 물체를 볼 수 있는 것은 난반사 덕분이다. 두 장의 거울을 직각으로 맞대면 빛은 두 번 반사된 뒤 들어온 방향과 나란하게 되돌아 나간다. 자전거의 반사판과 도로 표지판은 이 원리를 이용하며, 달 표면에 설치한 반사 장치에 레이저를 쏘아 지구와 달 사이의 거리를 재기도 한다.',
  ms:[{t:'입사각을 3가지 이상 바꾸며 나가는 빛의 방향을 확인하라.',set:{seen:{}},ok:s=>s.nseen>=3,sol:[{i:35},{i:50},{i:65}]}],
  ext:[{q:'직각으로 놓인 두 거울에서는 빛이 어느 각도로 들어와도 왔던 방향으로 되돌아간다. 반사 법칙으로 설명해 보자.',g:'첫 번째 거울에서의 반사각과 두 번째 거울에서의 입사각을 더하면 항상 90°가 된다는 점에서 출발해 보자.'},{q:'잠망경 속 두 거울은 왜 45° 기울어져 있을까?',g:'입사각이 45°이면 반사된 빛은 진행 방향이 90° 꺾인다. 이것이 두 번 일어나면 어떻게 될까?'}],
  inq:'작은 거울 두 장으로 잠망경을 설계하고, 거울의 각도가 45°에서 벗어나면 어떻게 보이는지 조사해 보자.',

 L:{op:'보석 낚시',code:'D6YA',terms:[0,1],
  cards:['빛이 공기에서 물로 들어갈 때, 두 물질이 만나는 경계면에서 꺾인다.','이렇게 빛이 꺾이는 것을 굴절이라고 한다.','굴절 때문에 물속의 동전은 실제보다 떠 보인다.','물에 담근 다리가 짧아 보이는 것도 굴절 때문이다.'],

 M:{op:'꺾인 빨대',code:'P5GW',
  text:['빛이 한 물질에서 다른 물질로 비스듬히 들어가면 {경계면|두 물질이 만나는 면}에서 꺾인다.','이 현상을 굴절이라고 한다.','{굴절각|굴절된 빛과 법선 사이의 각}은 물질에 따라 달라진다.','빛이 공기에서 물로 들어갈 때는 굴절각이 입사각보다 작다.','컵 속의 빨대가 꺾여 보이는 것은, 빨대에서 나온 빛이 물 밖으로 나오며 굴절하기 때문이다.'],

  ms:[{t:'입사각을 40°로 맞추고 굴절각을 읽어라.',ok:s=>s.i===40&&s.n<1.4,sol:{i:40,n:1.33}},{t:'아래쪽 물질을 유리로 바꾸고, 같은 입사각에서 굴절각을 비교하라.',ok:s=>s.i===40&&s.n>1.4,sol:{n:1.5}}],

 H:{op:'물고기 사냥꾼',code:'X3KR',
  text:'빛이 서로 다른 물질의 경계면에 비스듬히 입사하면 진행 방향이 꺾이는데, 이를 굴절이라고 한다. 굴절은 물질에 따라 빛의 속력이 다르기 때문에 일어난다. 빛이 공기에서 물로 들어갈 때는 굴절각이 입사각보다 작고, 물에서 공기로 나올 때는 굴절각이 입사각보다 크다. 우리 눈은 빛이 직진해 왔다고 여기므로 물속의 물체는 실제보다 얕은 곳에 있는 것처럼 보인다. 물에서 공기로 나가는 빛의 입사각이 어느 한계보다 커지면 빛은 물 밖으로 나가지 못하고 모두 반사된다.',
  ms:[{t:'빛의 방향을 물 → 공기로 바꾸고, 입사각 30°에서 굴절각을 확인하라.',ok:s=>s.rev===1&&s.i===30,sol:{rev:1,i:30}},{t:'빛이 물 밖으로 나가지 못하는 각도를 찾아라.',ok:s=>s.rev===1&&s.tir,sol:{rev:1,i:55}}],
  ext:[{q:'물에서 공기로 나가는 빛의 입사각을 점점 키우면 어떤 일이 일어날까?',g:'굴절각이 90°에 이르는 순간을 실험 장치에서 찾아보자. 그보다 큰 각도에서는 빛이 모두 반사된다. 이 현상을 전반사라고 한다.',b:1},{q:'물가에서 물고기를 작살로 잡으려면 보이는 위치보다 아래를 겨눠야 한다. 그 까닭은?',g:'물고기에서 나온 빛은 수면에서 꺾여 눈에 들어온다. 눈은 그 빛의 연장선 위에 물고기가 있다고 느낀다.'}],
  inq:'광섬유가 빛을 멀리까지 전달하는 원리와 쓰임새(통신, 내시경)를 조사해 보자.',
  quiz:[Q('빛이 물에서 공기로 나올 때, 굴절각과 입사각의 크기는?',['굴절각이 입사각보다 크다','굴절각이 입사각보다 작다','두 각의 크기가 같다'],'물에서 공기로 나오는 빛은 법선에서 멀어지는 쪽으로 꺾인다.'),Q('물 밖에서 물속의 물고기를 작살로 잡으려면 어디를 겨눠야 할까?',['보이는 곳보다 아래','보이는 곳보다 위','보이는 곳 그대로'],'물고기는 실제보다 떠 보이므로 실제 위치는 보이는 곳보다 깊다.')]}},

 L:{op:'장비 보급 작전',code:'B9FH',terms:[0,1,2],
  cards:['거울이나 렌즈를 통해 보이는 물체의 모습을 상이라고 한다.','볼록 거울은 넓은 범위를 작게 비춘다. 편의점 천장의 거울이 볼록 거울이다.','오목 거울은 가까이 있는 물체를 크게 비춘다. 화장 거울에 쓰인다.','볼록 렌즈는 가까이 있는 물체를 크게 보여 준다. 돋보기가 볼록 렌즈이다.'],

 M:{op:'장비 도감 완성',code:'T7MZ',
  text:['평면거울에는 물체와 크기가 같고 좌우가 바뀐 상이 생긴다.','{볼록 거울|가운데가 볼록 나온 거울}에는 항상 물체보다 작고 바로 선 상이 생긴다.','{오목 거울|가운데가 오목하게 들어간 거울}은 가까운 물체를 크고 바로 선 상으로, 먼 물체를 거꾸로 선 상으로 비춘다.','{볼록 렌즈|가운데가 가장자리보다 두꺼운 렌즈}도 가까운 물체는 크고 바로 선 상으로, 먼 물체는 거꾸로 선 상으로 보여 준다.','{오목 렌즈|가운데가 가장자리보다 얇은 렌즈}로 보면 항상 물체보다 작고 바로 선 상이 보인다.'],
  pre:Q('볼록 렌즈를 눈에서 멀리 떼고 먼 풍경을 보면 어떻게 보일까?',['거꾸로 보인다','크고 바로 보인다','원래 모습 그대로 보인다'],'볼록 렌즈는 멀리 있는 물체를 거꾸로 선 상으로 보여 준다.'),
  ms:[{t:'볼록 렌즈로 거꾸로 선 상을 만들어라.',ok:s=>s.dev==='cvxL'&&!s.up&&!s.blur,sol:{dev:'cvxL',d:2}},{t:'거리와 관계없이 항상 작고 바로 선 상을 만드는 장비 2가지를 모두 써 보라.',set:{tried:{}},ok:s=>s.tried.cvxM&&s.tried.ccvL,sol:[{dev:'cvxM'},{dev:'ccvL'}]}],

 H:{op:'뒤집힘의 경계',code:'C4QN',
  text:'평면거울은 물체와 같은 크기의 상을 만들지만, 면이 굽은 거울과 렌즈는 빛을 모으거나 퍼뜨려 상의 크기와 방향을 바꾼다. 빛을 퍼뜨리는 볼록 거울과 오목 렌즈는 물체의 위치와 관계없이 작고 바로 선 상을 만든다. 빛을 모으는 오목 거울과 볼록 렌즈는 물체가 가까이 있을 때는 크고 바로 선 상을, 멀리 있을 때는 거꾸로 선 상을 만든다. 상의 모습이 바뀌는 기준이 되는 위치가 초점이며, 초점은 나란하게 들어온 빛이 모이는 점이기도 하다.',
  ms:[{t:'볼록 렌즈에서 상이 뒤집히는 경계 위치를 찾아라.',ok:s=>s.dev==='cvxL'&&s.blur,sol:{dev:'cvxL',d:1}},{t:'오목 거울에도 같은 경계가 있는지 확인하라.',ok:s=>s.dev==='ccvM'&&s.blur,sol:{dev:'ccvM',d:1}}],

 M:{op:'화면 속 비밀',code:'J8WK',
  text:['빛의 삼원색은 빨간색, 초록색, 파란색이다.','{빛의 합성|여러 색의 빛이 합쳐져 다른 색으로 보이는 현상}으로 다양한 색을 만들 수 있다.','빨간색과 초록색 빛을 합성하면 노란색, 초록색과 파란색 빛을 합성하면 청록색, 빨간색과 파란색 빛을 합성하면 자홍색이 된다.','세 빛을 모두 합성하면 흰색이 된다.','스마트폰 화면은 {화소|화면을 이루는 아주 작은 점}마다 빨간색, 초록색, 파란색 빛의 밝기를 조절하여 색을 나타낸다.'],

 H:{op:'컬러 그림자',code:'N6XT',
  text:'빨간색, 초록색, 파란색 빛을 빛의 삼원색이라 하며, 이 세 빛의 밝기를 조절하여 합성하면 거의 모든 색의 빛을 만들 수 있다. 빨간색과 초록색 빛을 합성하면 노란색, 초록색과 파란색 빛을 합성하면 청록색, 빨간색과 파란색 빛을 합성하면 자홍색으로 보이고, 세 빛을 모두 합성하면 흰색으로 보인다. 빛은 합성할수록 눈에 들어오는 빛의 양이 늘어 밝아진다. 반대로 물감은 섞을수록 반사하는 빛이 줄어 어두워진다. 여러 색의 조명을 서로 다른 위치에서 비추면, 한 조명의 빛만 가려진 곳에 나머지 조명의 빛이 남아 색깔이 있는 그림자가 생긴다.',
  ms:[{t:'빨간색과 초록색 조명만 켜고, 두 그림자의 색을 확인하라.',ok:s=>s.r&&s.g&&!s.b,sol:{r:1,g:1,b:0}},{t:'세 조명을 모두 켜고, 그림자 3개의 색을 확인하라.',ok:s=>s.r&&s.g&&s.b,sol:{r:1,g:1,b:1}}],
  ext:[{q:'빨간색 조명과 초록색 조명을 함께 비출 때 생기는 두 그림자는 각각 무슨 색일까?',g:'빨간색 빛이 가려진 곳에는 어떤 빛만 도달하는지 생각해 보자.'},{q:'노란색 물체에 파란색 조명만 비추면 어떻게 보일까?',g:'노란색 물체는 빨간색 빛과 초록색 빛을 반사한다. 파란색 빛은 어떻게 될까?'}],

  quiz:[Q('빨간색과 초록색 조명을 함께 비출 때, 빨간색 빛만 가려진 곳의 그림자는 무슨 색일까?',['초록색','빨간색','검은색'],'빨간색 빛이 가려진 곳에는 초록색 빛만 도달한다.'),Q('빛의 합성과 물감의 혼합의 차이로 옳은 것은?',['빛은 합성할수록 밝아진다','빛은 합성할수록 어두워진다','둘 다 섞을수록 어두워진다'],'빛은 합성할수록 눈에 들어오는 빛의 양이 늘어난다.')]}},

 L:{op:'엄지 척 작전',code:'G3BP',terms:[0,1,2],

 M:{op:'6개월의 추적',code:'Y9HC',
  text:['관측하는 위치에 따라 물체의 위치가 달라져 보이는 각을 시차라고 한다.','지구는 태양 둘레를 {공전|다른 천체의 둘레를 도는 운동}한다.','그래서 6개월 간격으로 같은 별을 관측하면 별의 위치가 달라져 보인다.','이때 생기는 시차의 절반을 {연주 시차|6개월 간격으로 잰 시차의 1/2}라고 한다.','별이 가까울수록 연주 시차가 크고, 멀수록 작다.','연주 시차는 매우 작아서 {″|초, 1°를 3600으로 나눈 각} 단위로 나타낸다.'],

 H:{op:'1파섹의 약속',code:'E5MA',
  text:'지구가 태양 둘레를 공전하기 때문에 6개월 간격으로 가까운 별을 관측하면 멀리 있는 배경 별에 대해 위치가 달라져 보인다. 이때 측정한 시차의 1/2을 연주 시차라고 한다. 연주 시차는 별까지의 거리에 반비례하므로, 연주 시차를 측정하면 별까지의 거리를 구할 수 있다. 연주 시차가 1″인 별까지의 거리를 1 pc(파섹)이라 하며, 이는 약 3.26광년이다. 그러나 멀리 있는 별은 연주 시차가 너무 작아 측정하기 어려우므로, 이 방법은 비교적 가까운 별에만 쓸 수 있다.',
  ms:[{t:'10 pc 거리에 있는 별의 연주 시차를 확인하라.',ok:s=>s.d===10,sol:{d:10}},{t:'연주 시차가 0.20″인 별이 몇 pc 거리에 있는지 찾아라.',ok:s=>s.d===5,sol:{d:5}}],
  ext:[{q:'별까지의 거리(pc)와 연주 시차(″) 사이에는 어떤 관계식이 성립할까?',g:'실험 장치에서 거리와 연주 시차를 곱해 보자. 거리(pc) = 1 ÷ 연주 시차(″)임을 확인할 수 있다.'},{q:'연주 시차가 관측된다는 것은 지구가 공전한다는 증거가 된다. 그 까닭은?',g:'지구가 움직이지 않는다면 6개월 뒤에도 별은 배경 별에 대해 같은 자리에 보일 것이다.'}],

 H:{op:'색의 암호',code:'K5VF',

 H:{op:'성운의 정체',code:'H9AZ',

  ms:[{t:'은하 지도에 태양계의 위치를 표시하라.',ok:s=>s.pinOk,sol:galSol(1,'H')},{t:'단서 카드를 세 종류의 성운으로 모두 분류하라.',ok:s=>s.clsDone,sol:galSol(0,'H')}],

 H:{op:'시간 되감기',code:'P8YM',

function runSim(host,T,lv,ms,onDone,onStep){
 const sim=SIMS[T.sim],s=sim.init(lv);let mi=0;
 const apply=p=>{if(p)Object.assign(s,clone(p))};
 apply(ms[0].set);sim.calc(s,lv);
 host.innerHTML=`<ol class="mlist"></ol><div class="simview"></div><div class="ctrl"></div><div class="judge"><button type="button" class="btn" data-judge>판정 요청</button><span class="jmsg" aria-live="polite"></span></div>`;
 const view=$('.simview',host),ctrl=$('.ctrl',host),ml=$('.mlist',host),jm=$('.jmsg',host);
 const drawM=()=>ml.innerHTML=ms.map((m,i)=>`<li class="${i<mi?'ok':i===mi?'cur':''}">임무 ${i+1}. ${m.t}</li>`).join('');
 const draw=()=>view.innerHTML=sim.draw(s,lv);
 const drawC=()=>ctrl.innerHTML=sim.ctrl(lv,s).map(c=>c.tgs?`<label>${c.label}<div class="seg">${c.tgs.map(([k,l])=>`<button type="button" class="tg ${s[k]?'on':''}" data-tg="${k}">${l}</button>`).join('')}</div></label>`:c.opts?`<label>${c.label}<div class="seg">${c.opts.map(([v,l])=>`<button type="button" class="${String(s[c.k])===String(v)?'on':''}" data-seg="${c.k}" data-v="${v}">${l}</button>`).join('')}</div></label>`:`<label>${c.label}<input type="range" data-k="${c.k}" min="${c.min}" max="${c.max}" step="${c.step}" value="${s[c.k]}"></label>`).join('');
 const upd=()=>{sim.calc(s,lv);draw()};
 drawM();draw();drawC();
 host.addEventListener('input',e=>{const k=e.target.dataset.k;if(k){s[k]=+e.target.value;jm.textContent='';upd()}});
 host.addEventListener('click',e=>{const t=e.target;let b;
  if(t.closest('[data-judge]')){if(mi>=ms.length)return;sim.calc(s,lv);
   if(ms[mi].ok(s)){mi++;onStep&&onStep(mi);if(mi<ms.length){apply(ms[mi].set);upd();drawC();jm.className='jmsg good';jm.textContent='임무 성공. 다음 임무가 도착했다.'}else{jm.className='jmsg good';jm.textContent='모든 임무를 완수했다.';t.closest('[data-judge]').disabled=true;onDone()}drawM()}
   else{jm.className='jmsg bad';jm.textContent='아직 목표에 닿지 않았다. 장치를 조절해 다시 도전하라.';view.classList.remove('shake');void view.offsetWidth;view.classList.add('shake')}
   return}
  if(b=t.closest('[data-seg]')){const v=b.dataset.v;s[b.dataset.seg]=isNaN(+v)?v:+v;$$(`[data-seg="${b.dataset.seg}"]`,host).forEach(x=>x.classList.toggle('on',x===b));jm.textContent='';upd();return}
  if(b=t.closest('[data-tg]')){s[b.dataset.tg]=s[b.dataset.tg]?0:1;b.classList.toggle('on',!!s[b.dataset.tg]);jm.textContent='';upd();return}
  if(b=t.closest('[data-act]')){sim.act(s,b.dataset.act,lv);jm.textContent='';upd();return}
  if(b=t.closest('svg[data-tap]')){const r=b.getBoundingClientRect();sim.tap(s,(e.clientX-r.left)/r.width*480,(e.clientY-r.top)/r.height*280);jm.textContent='';upd()}});
}

const shuffle=a=>{a=a.map((v,i)=>[v,i]);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function runQuiz(host,items,lv,onDone){let qi=0;
 const guard=lv==='L'?`<div class="guard">관문 수호자 ${items.map((_,i)=>`<i data-g="${i}"></i>`).join('')}</div>`:'';
 host.innerHTML=guard+`<div class="qwrap"></div>`;const wrap=$('.qwrap',host);
 const show=()=>{const it=items[qi],os=shuffle(it.o);
  wrap.innerHTML=`<div class="qz"><div class="eyebrow">${lv==='L'?'보스 문제':'최종 관문'} ${qi+1} / ${items.length}</div><h3>${it.q}</h3><div class="opts">${os.map(([t,i])=>`<button type="button" data-i="${i}">${t}</button>`).join('')}</div><div class="exbox"></div></div>`;
  wrap.onclick=e=>{const b=e.target.closest('[data-i]');if(!b||wrap.dataset.lock)return;
   if(b.dataset.i==='0'){wrap.dataset.lock=1;b.classList.add('right');$$('.opts button',wrap).forEach(x=>x.disabled=true);const g=$(`[data-g="${qi}"]`,host);g&&g.classList.add('off');
    $('.exbox',wrap).innerHTML=`<div class="ex"><b>정답.</b> ${it.ex}</div><div class="row" style="margin-top:10px"><button type="button" class="btn" data-next>${qi<items.length-1?'다음 문제':'작전 완료 보고'}</button></div>`;
    $('[data-next]',wrap).onclick=ev=>{ev.stopPropagation();delete wrap.dataset.lock;qi++;if(qi<items.length)show();else onDone()}}
   else{b.classList.add('wrong');b.disabled=true;$('.exbox',wrap).innerHTML=`<div class="ex">다시 생각해 보라. 작전 브리핑의 핵심 개념을 떠올리면 된다.</div>`}}};
 show();
}

 $('#codeGo').onclick=go;$('#code').onkeydown=e=>{if(e.key==='Enter')go()};
 const r=$('#reset');if(r)r.onclick=()=>{ST.done={};save();renderHome()};
 renderTeacher('codes');
}
function decode(T,lv){
 window.scrollTo(0,0);
 const name=`작전명 '${T[lv].op}'`,pool='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 app.innerHTML=`<section class="card" style="${tcolor(T)}"><div class="eyebrow" style="text-align:center">비밀 지령 해독 중</div><div class="decode" id="dec"></div></section>`;
 let f=0;const N=14,el=$('#dec');
 const tick=()=>{f++;const k=Math.floor(name.length*f/N);el.textContent=name.slice(0,k)+[...name.slice(k)].map(c=>c===' '?' ':pool[Math.floor(Math.random()*pool.length)]).join('');
  if(f<N)setTimeout(tick,70);else setTimeout(()=>renderQuest(T,lv),450)};
 tick();
}

function termChip(T,i){return `<button type="button" class="chip" data-term="${i}">${T.gl[i][0]}</button>`}
function openTerms(T,only){const g=only!=null?[T.gl[only]]:T.gl,d=$('#dlg');
 d.innerHTML=`<h2>용어 사전</h2><div class="tw"><table><tr><th>한국어</th><th>English</th><th>中文</th></tr>${g.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td lang="zh-CN">${x[2]}</td></tr>`).join('')}</table></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn" id="dlgX">닫기</button></div>`;
 $('#dlgX').onclick=()=>d.close();d.showModal()}
function renderQuest(T,lv,step=0){
 window.scrollTo(0,0);
 const D=T[lv],L=LV[lv];
 const head=`<div class="eyebrow">${T.zone} 구역 · ${T.title}</div><h1>작전명 '${D.op}'</h1>
  <div class="tnote"><b>교사 해설</b> · 이 퀘스트는 <span class="lv">${L.n} 수준</span> (${L.who})입니다. 설계 기준: ${L.rule}. 학생 화면에는 수준 표시가 없고 작전명만 보입니다. <br><b>오개념 주의</b> · ${T.warn}</div>
  <div class="steps">${[0,1,2,3].map(i=>`<span class="${i<=step?'on':''}"></span>`).join('')}</div>`;
 const core=`<div class="core"><small>작전 브리핑 · 핵심 개념</small>${T.core}</div>`;
 let body='';
 if(step===0){
  body=core+tnote('핵심 개념 문장은 세 수준 모두 글자 하나 다르지 않게 같습니다. 난이도는 낮추되 개념의 정확성은 지키기 위한 장치입니다.');
  if(lv==='L')body+=`<div id="deck"></div>`+tnote(`지령 카드 ${D.cards.length}장 · 한 장에 한 문장, 한 개념만 담았습니다. 읽을 양은 가장 적고 넘기는 재미를 더했습니다.`);
  else if(lv==='M')body+=`<div class="card"><ol class="passage">${D.text.map(t=>`<li>${gloss(t)}</li>`).join('')}</ol></div>`+tnote('문장을 짧게 나누고, 핵심 용어 바로 뒤에 괄호 풀이를 붙였습니다.');
  else body+=`<div class="report">${D.text}</div>`+tnote('원문 지문을 그대로 제시합니다. 교과서 문장이 아니라 새로 쓴 글입니다.');
  body+=`<div class="row" style="margin-top:16px"><button type="button" class="btn" id="next" ${lv==='L'?'disabled':''}>탐사 활동 시작</button>${lv!=='L'?`<button type="button" class="btn ghost" id="terms">용어 사전</button>`:''}</div>`;
 }else if(step===1){
  body=`<div class="card"><h2>탐사 활동</h2>`;
  if(lv==='L')body+=`<div class="items"><span>수집한 용어 아이템</span><span id="bag">${D.terms.map(()=>`<span class="chip empty">???</span>`).join(' ')}</span></div>`+tnote(`핵심 용어는 ${D.terms.length}개만 '수집 아이템'으로 제시합니다. 누르면 한국어·영어·중국어 대역어가 나옵니다.`);
  if(lv==='M')body+=`<div id="pre"></div>`+tnote('먼저 결과를 예측하게 한 뒤 실험 장치로 확인합니다. 예측은 채점하지 않습니다.');
  body+=`<div id="sim"></div>`+tnote(lv==='L'?'조작 중심 활동입니다. 글을 읽는 대신 장치를 직접 움직여 개념을 확인합니다. 세 수준이 같은 장치를 쓰므로 한 학급이 같은 주제를 탐사한다는 소속감이 유지됩니다.':lv==='M'?'같은 실험 장치에 수치 읽기와 조건 바꾸기를 더했습니다.':'같은 실험 장치를 확장 질문의 탐구 도구로 씁니다.')+`</div>`;
  if(lv==='H')body+=`<div class="card"><h2>미해결 사건 파일</h2><p class="dim">정답을 고르는 문제가 아니다. 스스로 생각을 정리한 뒤 길잡이를 열어 보라.</p>${D.ext.map(x=>`<details class="ext"><summary>${x.q}${x.b?'<span class="tag tonly">교육과정 밖 맛보기</span>':''}</summary><p><b>길잡이</b> · ${x.g}</p></details>`).join('')}
   <h3 style="margin-top:14px">자유 탐사 제안</h3><p>${D.inq}</p>${tnote('생각을 확장하는 질문 2개와 탐구 주제 1개입니다.'+(D.ext.some(x=>x.b)?' 일부 질문은 <b>교육과정 밖 맛보기</b>입니다: '+D.ext.filter(x=>x.b).map(x=>'"'+x.q+'"').join(', '):''))}</div>`;
  body+=`<div class="row"><button type="button" class="btn" id="next" disabled>최종 관문으로</button>${lv!=='L'?`<button type="button" class="btn ghost" id="terms">용어 사전</button>`:''}</div>`;
 }else if(step===2){
  body=core+`<div id="quiz"></div>`+tnote('확인 문제는 세 수준 모두 2개입니다. 틀려도 감점 없이 다시 고를 수 있습니다.'+(lv==='L'?' 하 수준은 \'보스 문제\'와 수호자 게이지로 연출했습니다.':''));
 }else{
  body=`<section class="card" style="text-align:center"><div class="badge"><span>${T.badge}</span></div><div class="eyebrow">작전 완료 · 뱃지 획득</div><h2>'${T.badge}' 뱃지를 얻었다</h2>
   <p>개념 도감에 <b>${T.title}</b> 기록이 등록되었다.</p><div class="core" style="text-align:left">${'<small>도감 기록</small>'+T.core}</div>
   ${tnote('뱃지와 도감 기록은 세 수준이 완전히 같습니다. 보상으로 수준이 드러나지 않습니다.')}
   <div class="row" style="justify-content:center"><button type="button" class="btn" id="home">본부로 돌아가기</button></div>
   <div class="tonly" style="margin-top:14px"><div class="row" style="justify-content:center">${['L','M','H'].filter(x=>x!==lv).map(x=>`<button type="button" class="btn ghost small" data-open="${T.id}:${x}">같은 주제의 ${LV[x].n} 수준 '${T[x].op}' 보기</button>`).join('')}</div></div></section>`;
 }
 app.innerHTML=`<div style="${tcolor(T)}">${step<3?head:''}${body}</div>`;
 const nx=$('#next'),tm=$('#terms');if(tm)tm.onclick=()=>openTerms(T);
 if(step===0){
  if(lv==='L'){let ci=0;const dk=$('#deck');const show=()=>{dk.innerHTML=`<div class="deck"><small>지령 카드 ${ci+1} / ${D.cards.length}</small>${D.cards[ci]}</div><div class="pips">${D.cards.map((_,i)=>`<i class="${i<=ci?'on':''}"></i>`).join('')}</div><div class="row" style="justify-content:center">${ci>0?'<button type="button" class="btn ghost small" id="cp">이전 카드</button>':''}${ci<D.cards.length-1?'<button type="button" class="btn small" id="cn">다음 카드</button>':''}</div>`;
    const a=$('#cn'),b=$('#cp');if(a)a.onclick=()=>{ci++;show()};if(b)b.onclick=()=>{ci--;show()};if(ci===D.cards.length-1)nx.disabled=false};show()}
  nx.onclick=()=>renderQuest(T,lv,1);
 }else if(step===1){
  let preDone=lv!=='M',simDone=false,picked=null;
  const fin=()=>{if(simDone&&preDone)nx.disabled=false;if(simDone&&lv==='M'&&picked!=null){$('#pre .exbox').innerHTML=`<div class="ex"><b>${picked===0?'예측이 맞았다.':'예측과 달랐다.'}</b> ${D.pre.ex}</div>`}};
  if(lv==='M'){const p=$('#pre'),os=shuffle(D.pre.o);p.innerHTML=`<div class="qz"><div class="eyebrow">먼저 예측하라</div><h3>${D.pre.q}</h3><div class="opts">${os.map(([t,i])=>`<button type="button" data-i="${i}">${t}</button>`).join('')}</div><div class="exbox"></div></div>`;
   p.onclick=e=>{const b=e.target.closest('[data-i]');if(!b||preDone)return;preDone=true;picked=+b.dataset.i;b.style.borderColor='var(--tc)';b.style.fontWeight='700';$$('.opts button',p).forEach(x=>x.disabled=true);$('.exbox',p).innerHTML=`<div class="ex">예측을 기록했다. 아래 실험 장치로 직접 확인하라.</div>`;fin()}}
  runSim($('#sim'),T,lv,D.ms,()=>{simDone=true;if(lv==='L')fillBag(D.terms.length);toast('모든 임무 완수');fin()},mi=>{if(lv==='L')fillBag(Math.min(mi,D.terms.length))});
  function fillBag(n){const bag=$('#bag');if(!bag)return;const had=$$('.chip:not(.empty)',bag).length;bag.innerHTML=D.terms.map((t,i)=>i<n?termChip(T,t):`<span class="chip empty">???</span>`).join(' ');if(n>had)toast(`용어 아이템 획득: ${T.gl[D.terms[n-1]][0]}`)}
  const its=$('.items',app);if(its)its.onclick=e=>{const c=e.target.closest('[data-term]');if(c)openTerms(T,+c.dataset.term)};
  nx.onclick=()=>renderQuest(T,lv,2);
 }else if(step===2){
  runQuiz($('#quiz'),D.quiz,lv,()=>{ST.done[T.id]=1;save();renderQuest(T,lv,3)});
 }else{
  $('#home').onclick=renderHome;
  $$('[data-open]',app).forEach(b=>b.onclick=()=>{const[i,x]=b.dataset.open.split(':');renderQuest(TOPICS[i-1],x)});
 }
}

function partsPrompt(T){return `[Persona] 당신은 학력 차이가 큰 중학교 2학년 교실을 맡은 과학 교사입니다.

[Act] 첨부한 지문을 상/중/하 세 가지 난이도 버전으로 바꿔 주세요. 어느 버전에서도 '${T.core}'라는 핵심 개념은 한 글자도 바꾸지 말고 그대로 지켜 주시기 바랍니다. 각 버전에는 수준이 드러나지 않도록 서로 다른 '작전명'을 붙여 주세요.

[Recipient] 자료를 읽을 학생은 세 그룹입니다. '상'은 심화 학습을 원하는 학생, '중'은 평균 수준의 학생, '하'는 기초학력 지원이 필요한 학생과 다문화 학생입니다. 학생이 자신의 수준이 다르다고 느끼지 않도록, 세 버전 모두 탐사대의 비밀 지령(퀘스트) 형식으로 써 주세요.

[Theme] 지문은 중학교 2학년 과학 '${T.title}'을 다룹니다. 학생들이 일상의 예시와 연결해 개념을 이해하도록 돕고 싶습니다.

[Structure] 세 버전을 표로 나란히 보여 주세요.
- 하: 한 문장에 한 개념, 일상 예시, 핵심 용어 3개 이내, 확인 문제 2개
- 중: 문장을 짧게 나누고 핵심 용어에 괄호 풀이, 확인 문제 2개
- 상: 원문 유지, 생각을 확장하는 질문 2개, 탐구 주제 제안, 확인 문제 2개

[후속 프롬프트] 다음 용어를 중학생도 이해할 수 있도록 일상 예시와 함께 쉽게 풀어 주세요: ${T.gl.map(g=>g[0]).join(', ')}. 비유가 개념을 왜곡하는 부분이 있다면 그 한계를 한 줄로 밝혀 주시기 바랍니다. 다문화 학생을 위해 용어집에 영어와 중국어 대역어도 함께 넣어 주세요.`}

 else if(tab==='prompt')h=pick+`<p class="dim">연수에서 다룬 P.A.R.T.S. 틀(Persona · Act · Recipient · Theme · Structure)에 맞춘 예시 프롬프트입니다. 지문을 첨부하고 주제만 바꾸면 다른 교과에도 쓸 수 있습니다. 생성 결과는 초안이므로 교과서와 대조하여 검증해야 합니다.</p><pre class="prompt" id="pp">${partsPrompt(T)}</pre><button type="button" class="btn small" id="cp">프롬프트 복사</button>`;

 else h=`<h3>이 자료의 설계 원칙</h3><ul>

   <li><b>하 수준이 더 재미있어 보이게 한다.</b> 읽을 양은 가장 적고, 직접 조작하는 임무와 수집 요소, 보스 문제 연출은 가장 많습니다.</li>

  <h3>수준별 기준</h3><div class="tw"><table><tr><th>수준</th><th>대상</th><th>기준</th></tr>${['H','M','L'].map(x=>`<tr><td><span class="lv">${LV[x].n}</span></td><td>${LV[x].who}</td><td>${LV[x].rule}</td></tr>`).join('')}</table></div>
  <h3 style="margin-top:16px">사용 전 확인할 것</h3><ul>
   <li>지문과 문제는 AI로 초안을 만들고 교사가 검토하는 방식으로 제작했습니다. 교과서 문장은 쓰지 않았습니다. 사용하는 교과서의 용어·수치와 대조해 주세요. 특히 태양계의 위치(약 3만 광년), 우리은하의 지름(약 10만 광년), 별의 색 구분과 온도 단위, 1등급 차이(약 2.5배), pc 단위, 우주의 나이(약 138억 년)를 확인해 주세요.</li>
   <li>상 수준의 일부 확장 질문은 교육과정 밖 맛보기이며, '수준 비교' 탭에 표시되어 있습니다.</li>
   <li>중국어 대역어는 원어민이나 이중언어 강사의 확인을 권합니다.</li>
   <li>이 자료는 교사 공유·시연용이라 '교사 해설' 스위치가 화면에 보입니다. 실제 수업에 쓰려면 스위치를 숨겨야 합니다.</li>
   <li>학생 정보는 수집하지 않습니다. 도감 기록은 이 기기의 브라우저에만 저장됩니다.</li></ul>`;
 p.innerHTML=`<div class="card"><div class="eyebrow" style="color:var(--blue)">교사 해설 모드</div><h2>수준별 설계 들여다보기</h2><div class="tabs">${tabs.map(([k,l])=>`<button type="button" class="${k===tab?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>${h}</div>`;
 p.onclick=e=>{let b;
  if(b=e.target.closest('[data-tab]'))renderTeacher(b.dataset.tab,tid);
  else if(b=e.target.closest('[data-tid]'))renderTeacher(tab,+b.dataset.tid);
  else if(b=e.target.closest('[data-open]')){const[i,x]=b.dataset.open.split(':');renderQuest(TOPICS[i-1],x)}
  else if(e.target.id==='cp'){const t=$('#pp').textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('프롬프트를 복사했습니다')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#pp'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('선택된 내용을 직접 복사해 주세요')})}};
}

/* ===================== 시작 ===================== */
if(typeof document!=='undefined'&&app){
 $('#tSwitch').onclick=()=>setTeacher(!ST.teacher);
 $('#goHome').onclick=renderHome;
 setTeacher(!!ST.teacher);
 renderHome();
}
</script>
